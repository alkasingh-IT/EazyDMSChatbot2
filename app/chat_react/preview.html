<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMS AI Chat — Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #0b0f19;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      overflow: hidden;
    }
    #root {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-shell {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f172a;
    }
    .preview-banner {
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      z-index: 50;
    }
    .preview-banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preview-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 9px;
      border-radius: 9999px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }
    .preview-file-tag {
      color: #60a5fa;
      font-weight: 600;
      font-size: 12px;
    }
    .preview-hint {
      color: #64748b;
      font-size: 11px;
    }
    .preview-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #10b981;
      font-weight: 500;
    }
    .preview-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .preview-component-wrap {
      flex: 1;
      min-height: 0;
      height: calc(100vh - 37px);
      position: relative;
    }
    /* Ensure the component fills available space */
    .preview-component-wrap > div,
    .preview-component-wrap .nac-container,
    .preview-component-wrap .nac-standalone-root {
      height: 100% !important;
      max-height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       MOCK BACKEND API FOR STANDALONE PREVIEW
       ═══════════════════════════════════════════════════════════════════ */
    const MOCK_RESPONSES = [
      {
        answer: "**Secondary Sales Summary — September 2026** 📊\n\nTotal secondary sales have reached **₹42.8 Lakhs** across all territories (+18.4% MoM).\n\n- **Top territory:** Chennai Central — ₹8.20L (142 orders)\n- **Second highest:** Bangalore Hub — ₹6.70L (98 orders)\n- **Highest conversion rate:** Mumbai West — 87.5%\n\nClick any chart bar or column header to inspect granular dealer metrics.",
        columns: ["outlet_name", "total_selling_price", "order_count", "growth_pct"],
        rows: [
          { outlet_name: "Chennai Central", total_selling_price: 820000, order_count: 142, growth_pct: "+24%" },
          { outlet_name: "Bangalore Hub", total_selling_price: 670000, order_count: 98, growth_pct: "+19%" },
          { outlet_name: "Mumbai West", total_selling_price: 590000, order_count: 87, growth_pct: "+15%" },
          { outlet_name: "Delhi NCR", total_selling_price: 510000, order_count: 74, growth_pct: "+12%" },
          { outlet_name: "Hyderabad Urban", total_selling_price: 430000, order_count: 61, growth_pct: "+8%" }
        ],
        chart_spec: { chart_type: "bar", x: "outlet_name", y: "total_selling_price" }
      },
      {
        answer: "**Primary vs Secondary Sales (H1 Trend)** 📈\n\n| Month | Primary (₹L) | Secondary (₹L) | Stock Cover (Days) |\n|---|---|---|---|\n| Apr | 38.2 | 29.5 | 38 |\n| May | 41.0 | 34.1 | 34 |\n| Jun | 43.5 | 39.2 | 31 |\n| Jul | 40.1 | 38.8 | 29 |\n| Aug | 36.2 | 36.2 | 28 |\n| Sep | 44.0 | 42.8 | 27 |\n\n💡 **Key Takeaway:** Channel pipeline inventory normalized from 38 days to 27 days.",
        columns: ["month", "primary_sales", "secondary_sales", "stock_cover_days"],
        rows: [
          { month: "Apr", primary_sales: 3820000, secondary_sales: 2950000, stock_cover_days: 38 },
          { month: "May", primary_sales: 4100000, secondary_sales: 3410000, stock_cover_days: 34 },
          { month: "Jun", primary_sales: 4350000, secondary_sales: 3920000, stock_cover_days: 31 },
          { month: "Jul", primary_sales: 4010000, secondary_sales: 3880000, stock_cover_days: 29 },
          { month: "Aug", primary_sales: 3620000, secondary_sales: 3620000, stock_cover_days: 28 },
          { month: "Sep", primary_sales: 4400000, secondary_sales: 4280000, stock_cover_days: 27 }
        ],
        chart_spec: { chart_type: "line", x: "month", y: "secondary_sales" }
      },
      {
        answer: "**Top Selling SKUs by Revenue** 🏆\n\n1. **Premium SKU Pack (1L)** — ₹28.9L (4,820 units)\n2. **Classic Beverage (500ml)** — ₹22.4L (12,340 units)\n3. **Snack Bundle Pack** — ₹17.8L (8,760 units)\n4. **Hydra Water 500ml** — ₹15.2L (23,100 units)\n5. **Energy Drink 250ml** — ₹13.7L (6,890 units)\n\n*Top 5 SKUs account for 68.4% of aggregate monthly turnover.*",
        columns: ["item_name", "quantity", "selling_price", "category"],
        rows: [
          { item_name: "Premium SKU Pack 1L", quantity: 4820, selling_price: 2890000, category: "Beverages" },
          { item_name: "Classic Beverage 500ml", quantity: 12340, selling_price: 2240000, category: "Beverages" },
          { item_name: "Snack Bundle Pack", quantity: 8760, selling_price: 1780000, category: "Foods" },
          { item_name: "Hydra Water 500ml", quantity: 23100, selling_price: 1520000, category: "Water" },
          { item_name: "Energy Drink 250ml", quantity: 6890, selling_price: 1370000, category: "Energy" }
        ],
        chart_spec: { chart_type: "bar", x: "item_name", y: "selling_price" }
      },
      {
        answer: "**Dealer Contribution Share** 🤝\n\n- **Rajesh Distributors:** ₹12.40 Lakhs (48 orders)\n- **Metro Traders:** ₹9.80 Lakhs (36 orders)\n- **Sunrise Enterprises:** ₹8.20 Lakhs (29 orders)\n- **City Wholesale Co:** ₹7.10 Lakhs (24 orders)\n- **Kumar & Sons:** ₹5.90 Lakhs (19 orders)\n\nAll accounts have active credit limits with 0 overdue invoices > 45 days.",
        columns: ["customer_name", "bill_amount", "order_count"],
        rows: [
          { customer_name: "Rajesh Distributors", bill_amount: 1240000, order_count: 48 },
          { customer_name: "Metro Traders", bill_amount: 980000, order_count: 36 },
          { customer_name: "Sunrise Enterprises", bill_amount: 820000, order_count: 29 },
          { customer_name: "City Wholesale Co", bill_amount: 710000, order_count: 24 },
          { customer_name: "Kumar & Sons", bill_amount: 590000, order_count: 19 }
        ],
        chart_spec: { chart_type: "pie", x: "customer_name", y: "bill_amount" }
      }
    ];

    let _mockIdx = 0;

    window.fetch = async (url, opts = {}) => {
      const urlStr = String(url);
      const delay = ms => new Promise(r => setTimeout(r, ms));

      if (urlStr.includes('/api/chat/history') || urlStr.includes('/api/prefs') || urlStr.includes('/api/sessions')) {
        await delay(50);
        return {
          ok: true,
          status: 200,
          json: async () => ({ sessions: [] })
        };
      }

      if (urlStr.includes('/api/chat')) {
        await delay(1100);
        const resp = MOCK_RESPONSES[_mockIdx % MOCK_RESPONSES.length];
        _mockIdx++;
        return {
          ok: true,
          status: 200,
          json: async () => ({
            answer: resp.answer,
            columns: resp.columns,
            rows: resp.rows,
            chart_spec: resp.chart_spec,
            session_id: 'mock-sess-' + Date.now(),
            flag: null
          })
        };
      }

      await delay(50);
      return { ok: true, status: 200, json: async () => ({}) };
    };
  </script>

  <!-- Pre-bundled React 18 + DMSAIChat Component -->
  <script src="bundle.js"></script>
</body>
</html>
