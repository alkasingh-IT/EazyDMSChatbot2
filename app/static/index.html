<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Owzy Chat &mdash; DMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f4f6fb;
    }

    /* ── Slim control rail ─────────────────────────────────────── */
    .nc-rail {
      width: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 20px 16px;
      background: #101828;
      color: #e8eaf0;
      overflow-y: auto;
    }
    .nc-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .nc-brand-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #8b2f10, #e66b17);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
    }
    .nc-brand-title { font-size: 14px; font-weight: 700; color: #fff; }
    .nc-brand-sub   { font-size: 10.5px; color: #8f95a8; }
    .nc-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: #98a2b3; margin: 10px 0 5px;
    }
    .nc-select, .nc-toggle {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: #e8eaf0;
      border-radius: 9px;
      padding: 9px 11px;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }
    .nc-select option { color: #101828; }
    .nc-toggle {
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      text-align: left;
    }
    .nc-toggle--on { border-color: rgba(230,107,23,.65); box-shadow: 0 0 0 1px rgba(230,107,23,.35) inset; }
    .nc-rail-note {
      margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 10.5px; color: #667085; line-height: 1.5;
    }
    .nc-rail-warn { color: #f59e0b; }

    /* ── Chat stage ────────────────────────────────────────────── */
    #view-chat { flex: 1; min-width: 0; height: 100%; }
    .native-chat-root { height: 100%; }
    .native-chat-loading {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: #667085; font-size: 13px; text-align: center;
    }
    @media (max-width: 720px) {
      .nc-rail { position: absolute; z-index: 20; height: 100%; }
      .nc-rail--hidden { display: none; }
      .nc-menu-btn { display: flex !important; }
    }
    .nc-menu-btn {
      display: none;
      position: fixed; top: 12px; left: 12px; z-index: 30;
      width: 38px; height: 38px; border-radius: 9px;
      background: rgba(16,24,40,0.9); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; align-items: center; justify-content: center; cursor: pointer;
    }
  </style>
</head>
<body>

<button class="nc-menu-btn" id="ncMenuBtn" title="Menu" aria-label="Menu">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- ── Control rail: staff selector + BI on/off ────────────────── -->
<aside class="nc-rail" id="ncRail">
  <div class="nc-brand">
    <div class="nc-brand-icon">&#9889;</div>
    <div>
      <div class="nc-brand-title">Owzy Chat</div>
      <div class="nc-brand-sub">DMS Analytics</div>
    </div>
  </div>

  <label class="nc-label" for="staffUid">Staff Member</label>
  <select id="staffUid" class="nc-select">
    <option value="">Loading staff...</option>
  </select>

  <label class="nc-label" style="margin-top:12px;">AI Analytics</label>
  <button id="aiAnalyticsToggle" class="nc-toggle" style="cursor:pointer;">
    <span id="aiAnalyticsState">OFF &mdash; Direct BI</span>
    <span>&#128267;</span>
  </button>

  <div class="nc-rail-note" id="ncRailNote">
    Ask anything about your sales force data. Reports, trends, and instant answers,
    all scoped to your territory.
  </div>
</aside>

<!-- ── Native chat stage ───────────────────────────────────────── -->
<main id="view-chat" class="active">
  <div id="nativeChatRoot" class="native-chat-root">
    <div class="native-chat-loading">Loading Owzy chat...</div>
  </div>
</main>

<script>
(function () {
  /* ── Staff selector (public /api/staff) ─────────────────────── */
  async function fetchStaff() {
    try {
      const resp = await fetch('/api/staff');
      const data = await resp.json();
      const sel = document.getElementById('staffUid');
      if (!data.staff || !data.staff.length) {
        sel.innerHTML = '<option value="">No staff found</option>';
        return;
      }
      sel.innerHTML = '<option value="">Select Staff...</option>';
      data.staff.forEach(function (s) {
        const opt = document.createElement('option');
        opt.value = s.userid;
        opt.textContent = (s.name ? String(s.name).trim() : 'Unknown') + ' (' + (s.employee_code || String(s.userid).slice(0, 8)) + ')';
        sel.appendChild(opt);
      });
      const autoUid = localStorage.getItem('dms_staff_uid');
      if (autoUid && data.staff.find(function (s) { return s.userid === autoUid; })) sel.value = autoUid;
      if (window.mountNativeChat) window.mountNativeChat();
    } catch (e) {
      console.error('Failed to load staff', e);
      document.getElementById('staffUid').innerHTML = '<option value="">Error loading staff</option>';
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('staffUid').addEventListener('change', function () {
      localStorage.setItem('dms_staff_uid', this.value || '');
      if (window.mountNativeChat) window.mountNativeChat();
    });
    document.getElementById('ncMenuBtn').addEventListener('click', function () {
      document.getElementById('ncRail').classList.toggle('nc-rail--hidden');
    });
    fetchStaff();
  });
})();
</script>

<script>
(function () {
  /* ── BI ON/OFF mode selector ────────────────────────────────── */
  var btn = document.getElementById('aiAnalyticsToggle');
  if (!btn) return;
  function paint() {
    var on = localStorage.getItem('dms_ai_analytics') === '1';
    document.getElementById('aiAnalyticsState').innerHTML = on
      ? 'ON &mdash; AI Narrative'
      : 'OFF &mdash; Direct BI';
    btn.classList.toggle('nc-toggle--on', on);
  }
  btn.addEventListener('click', function () {
    localStorage.setItem('dms_ai_analytics', localStorage.getItem('dms_ai_analytics') === '1' ? '0' : '1');
    paint();
    window.dispatchEvent(new CustomEvent('dms-ai-analytics-changed'));
  });
  paint();
})();
</script>

<!-- ── Native AI Chat loader (password-gated /d3, like SFA) ─────── -->
<script>
(function () {
  var _mounted = false;
  var _nativeChatEnabled = null;

  function _sessionUid() {
    // X-UID must be a registered DMS session UUID (set by the host integration,
    // or passed as ?xuid=...). Falls back to the selected staff UID.
    var q = new URLSearchParams(location.search).get('xuid');
    var staff = (document.getElementById('staffUid') || {}).value || '';
    return (q || localStorage.getItem('dms_session_uid') || staff || '').trim();
  }

  function _props() {
    var staff = (document.getElementById('staffUid') || {}).value || '';
    var ai = localStorage.getItem('dms_ai_analytics') === '1';
    return { isMaximized: true, user: {
      // Same-origin API so the native-chat gate's Basic credentials apply.
      dmsAiBaseUrl: window.location.origin,
      isEazyAiEnabled: true,
      "X-UID": _sessionUid(),
      "U-UID": staff,
      "x-uid": _sessionUid(),
      "x-staff-uid": staff,
      "x-ai-analytics": ai
    } };
  }

  function mountNativeChat() {
    if (!window.__DMS_CHAT_MODULE__ || !_nativeChatEnabled) return;
    var rootEl = document.getElementById('nativeChatRoot');
    if (!rootEl) return;
    var staff = (document.getElementById('staffUid') || {}).value || '';
    rootEl._root = rootEl._root || ReactDOM.createRoot(rootEl);
    if (!staff) {
      rootEl._root.render(React.createElement('div', { className: 'native-chat-loading' },
        'Select a staff member from the dropdown to start chatting with Owzy.'));
      return;
    }
    rootEl._root.render(React.createElement(window.__DMS_CHAT_MODULE__.default, _props()));
  }
  window.mountNativeChat = mountNativeChat;

  function showDisabled() {
    var rootEl = document.getElementById('nativeChatRoot');
    if (rootEl) {
      rootEl.innerHTML =
        '<div class="native-chat-loading" style="flex-direction:column;">' +
          '<strong style="font-size:17px;color:#101828;">Native chat is turned off</strong>' +
          '<div style="max-width:420px;line-height:1.6;">This embedded chat has been disabled. Please use the main application instead.</div>' +
        '</div>';
    }
  }

  function loadAndCompile() {
    if (_mounted) return;
    _mounted = true;
    window.require = function (mod) {
      if (mod === 'react' || mod === 'react/jsx-runtime') return window.React;
      if (mod === 'react-dom' || mod === 'react-dom/client') return window.ReactDOM;
      if (/\.(png|jpe?g|gif|svg|webp|avif|ico)$/i.test(mod)) return '/d3/' + mod.split('/').pop();
      return {};
    };
    var SRC = ['/d3/DMSAIChat.jsx'];
    fetch(SRC[0], { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + SRC[0]); return r.text(); })
      .then(function (src) {
        var compiled = Babel.transform(src, {
          filename: 'DMSAIChat.jsx',
          presets: [['react', { runtime: 'classic' }]],
          plugins: ['transform-modules-commonjs']
        }).code;
        var mod = { exports: {} };
        (new Function('require', 'module', 'exports', compiled))(window.require, mod, mod.exports);
        window.__DMS_CHAT_MODULE__ = mod.exports;
        mountNativeChat();
      })
      .catch(function (err) {
        document.getElementById('nativeChatRoot').innerHTML =
          '<div style="padding:40px;color:#dc2626;font-family:monospace;font-size:13px;">' +
          '<strong>Chat load error:</strong><br>' + err.message + '</div>';
        console.error('[DMSAIChat] load error:', err);
      });
  }

  document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/native-chat/status')
      .then(function (r) { return r.ok ? r.json() : { enabled: false }; })
      .catch(function () { return { enabled: false }; })
      .then(function (st) {
        _nativeChatEnabled = !!(st && st.enabled);
        window.addEventListener('dms-ai-analytics-changed', mountNativeChat);
        if (_nativeChatEnabled) loadAndCompile();
        else showDisabled();
      });
  });
})();
</script>
</body>
</html>
